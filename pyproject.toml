[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerialvp"
version = "0.1.0"
description = "AerialVP: task-aware prompt enhancement for UAV image perception"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.10,<3", "jsonschema>=4.23,<5", "requests>=2.32,<3", "python-dotenv>=1,<2", "Pillow>=10"]

[project.optional-dependencies]
models = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "transformers==4.51.3", "accelerate>=1.1,<2", "ultralytics==8.3.113", "sentencepiece==0.2.0", "protobuf>=3.20,<6", "numpy<2", "huggingface-hub<1", "qwen-vl-utils>=0.0.10", "bitsandbytes>=0.45,<0.49", "ftfy>=6", "einops>=0.8", "timm>=1", "opencv-python>=4.8,<4.12", "clip @ git+https://github.com/openai/CLIP.git"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
aerialvp = "aerialvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

